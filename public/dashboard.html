<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Dashboard | ChargePoint</title>
    <link rel="stylesheet" href="index.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        .progress-circle {
            position: relative;
            width: 180px;
            height: 180px;
            margin: 0 auto;
            border-radius: 50%;
            background: conic-gradient(from 0deg, #00f2fe 0%, #4facfe 0%, transparent 0%);
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background 0.5s;
        }

        .progress-circle::after {
            content: '';
            position: absolute;
            inset: 10px;
            background: var(--bg-color);
            border-radius: 50%;
        }

        .inner-stats {
            position: relative;
            z-index: 1;
            text-align: center;
        }

        .kwh-val {
            font-size: 2.5rem;
            font-weight: 600;
        }

        .kwh-unit {
            font-size: 0.8rem;
            color: var(--text-dim);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 20px;
        }

        .stat-box {
            background: rgba(255, 255, 255, 0.05);
            padding: 15px;
            border-radius: 12px;
            text-align: left;
        }

        .stat-label {
            font-size: 0.75rem;
            color: var(--text-dim);
            margin-bottom: 5px;
        }

        .stat-val {
            font-weight: 600;
            font-size: 1.1rem;
        }

        .stop-btn {
            background: rgba(239, 68, 68, 0.1);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.2);
            padding: 14px;
            border-radius: 12px;
            font-weight: 600;
            width: 100%;
            cursor: pointer;
            margin-top: 10px;
        }
    </style>
</head>

<body>
    <div class="glass-container">
        <header>
            <div class="logo">⚡ Charging<span>Live</span></div>
            <div id="station-id" class="badge">Station: ---</div>
        </header>

        <main>
            <div class="progress-circle" id="progress-circle">
                <div class="inner-stats">
                    <div id="kwh" class="kwh-val">0.00</div>
                    <div class="kwh-unit">kWh Delivered</div>
                </div>
            </div>

            <div class="stats-grid">
                <div class="stat-box">
                    <div class="stat-label">Duration</div>
                    <div id="duration" class="stat-val">00:00:00</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">Est. Cost</div>
                    <div id="cost" class="stat-val">$0.00</div>
                </div>
            </div>

            <button id="stop-btn" class="stop-btn">Stop Charging</button>
        </main>

        <footer>
            <p>Do not unplug until session stops.</p>
        </footer>
    </div>

    <script>
        const transactionId = localStorage.getItem('activeTransactionId');
        const kwhEl = document.getElementById('kwh');
        const costEl = document.getElementById('cost');
        const durationEl = document.getElementById('duration');
        const stationIdEl = document.getElementById('station-id');
        const progressCircle = document.getElementById('progress-circle');
        const stopBtn = document.getElementById('stop-btn');

        let startTime = new Date();

        let currentStationId = '---';

        async function updateDashboard() {
            if (!transactionId) return;

            try {
                const res = await fetch(`/api/active-session/${transactionId}`);
                const data = await res.json();

                if (data.error) throw new Error(data.error);

                currentStationId = data.stationId;
                stationIdEl.textContent = `Station: ${data.stationId}`;
                kwhEl.textContent = Number(data.totalKwh).toFixed(2);
                costEl.textContent = `$${(Number(data.totalKwh) * 0.30).toFixed(2)}`; // Using 0.30 rate

                if (data.startTime) {
                    startTime = new Date(data.startTime);
                    updateDuration();
                }

                // Visual progress (fake animation for now, maps 0-100% to some capacity if we had one)
                const percent = Math.min((data.totalKwh / 50) * 100, 100); // Assume 50kWh max for visual
                progressCircle.style.background = `conic-gradient(from 0deg, #00f2fe 0%, #4facfe ${percent}%, transparent ${percent}%)`;

                if (!data.isActive) {
                    // Redirect to receipt instead of index
                    window.location.href = `receipt.html?transactionId=${transactionId}`;
                }

            } catch (err) {
                console.error('Update failed:', err);
                // If session is lost, maybe redirect back?
            }
        }

        function updateDuration() {
            const now = new Date();
            const diff = Math.floor((now - startTime) / 1000);
            const h = Math.floor(diff / 3600).toString().padStart(2, '0');
            const m = Math.floor((diff % 3600) / 60).toString().padStart(2, '0');
            const s = (diff % 60).toString().padStart(2, '0');
            durationEl.textContent = `${h}:${m}:${s}`;
        }

        stopBtn.addEventListener('click', async () => {
            if (!confirm('Stop charging session?')) return;

            stopBtn.disabled = true;
            stopBtn.textContent = 'Stopping...';

            try {
                const res = await fetch(`/api/stop-charging/${currentStationId}/${transactionId}`);
                const data = await res.json();

                if (data.success) {
                    alert('Stop command sent to station. Session will end shortly.');
                } else {
                    alert('Failed to send stop command. Please try again.');
                    stopBtn.disabled = false;
                    stopBtn.textContent = 'Stop Charging';
                }
            } catch (err) {
                console.error('Stop request failed:', err);
                alert('Connection error. Could not stop session.');
                stopBtn.disabled = false;
                stopBtn.textContent = 'Stop Charging';
            }
        });

        // Loop
        updateDashboard();
        setInterval(updateDashboard, 5000);
        setInterval(updateDuration, 1000);
    </script>
</body>

</html>
